{% extends "base.html" %}
{% block title %}Add Vehicle - AUTOSAT{% endblock %}
{% block content %}
<header class="admin-header">
    <div class="container">
        <a href="/admin/dashboard">Back</a>
        <h1>Add Vehicle</h1>
    </div>
</header>
<div class="admin-form container">
    <form method="POST" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Title" required>
        <input type="text" name="brand" placeholder="Brand" required>
        <input type="text" name="model" placeholder="Model" required>
        <input type="number" name="year" placeholder="Year" required>
        <input type="number" name="price" placeholder="Price (₦)" required>
        <select name="condition" required>
            <option>Brand New</option>
            <option>Tokunbo</option>
            <option>Nigerian Used</option>
        </select>
        <select name="listing_type" required>
            <option>Sale</option>
            <option>Rent</option>
        </select>
        <select name="body_style">
            <option>Sedan</option>
            <option>SUV</option>
            <option>Coupe</option>
        </select>
        <select name="drive_type">
            <option>AWD</option>
            <option>RWD</option>
            <option>FWD</option>
        </select>
        <input type="text" name="transmission" placeholder="Transmission">
        <input type="text" name="mileage" placeholder="Mileage">
        <textarea name="description" placeholder="Description"></textarea>
        <input type="text" name="primary_image_url" placeholder="Primary Image URL">
        <input type="text" name="image_urls" placeholder="Additional Image URLs (comma separated)">
        <input type="file" name="images" multiple>
        <label><input type="checkbox" name="featured"> Featured</label>
        <label><input type="checkbox" name="customs_verified"> Customs Verified</label>
        <input type="number" name="inspection_score" placeholder="Inspection Score">
        <input type="text" name="inspection_report_url" placeholder="Inspection Report URL">
        <button type="submit">Save Vehicle</button>
    </form>
</div>
{% endblock %}
