{% extends "base.html" %}
{% block title %}Admin Login - AUTOSAT{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl p-8">
        <h1 class="text-2xl font-bold text-center text-gold">Admin Login</h1>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="mt-4 text-red-500 text-center">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="POST" class="mt-6">
            <input type="password" name="password" placeholder="Password" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white mb-4">
            <button class="w-full bg-gold text-black font-bold py-3 rounded-lg">Login</button>
        </form>
    </div>
</div>
{% endblock %}
