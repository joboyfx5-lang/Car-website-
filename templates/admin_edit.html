{% extends "base.html" %}
{% block title %}Edit Vehicle - AUTOSAT{% endblock %}
{% block content %}
<header class="admin-header">
    <div class="container">
        <a href="/admin/dashboard">Back</a>
        <h1>Edit Vehicle</h1>
    </div>
</header>
<div class="admin-form container">
    <form method="POST" enctype="multipart/form-data">
        <input type="text" name="title" value="{{ vehicle.title }}" required>
        <input type="text" name="brand" value="{{ vehicle.brand }}" required>
        <input type="text" name="model" value="{{ vehicle.model }}" required>
        <input type="number" name="year" value="{{ vehicle.year }}" required>
        <input type="number" name="price" value="{{ vehicle.price }}" required>
        <select name="condition" required>
            {% for c in ['Brand New', 'Tokunbo', 'Nigerian Used'] %}
                <option {% if vehicle.condition == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
        <select name="listing_type" required>
            {% for lt in ['Sale', 'Rent'] %}
                <option {% if vehicle.listing_type == lt %}selected{% endif %}>{{ lt }}</option>
            {% endfor %}
        </select>
        <select name="body_style">
            {% for bs in ['Sedan', 'SUV', 'Coupe'] %}
                <option {% if vehicle.body_style == bs %}selected{% endif %}>{{ bs }}</option>
            {% endfor %}
        </select>
        <select name="drive_type">
            {% for dt in ['AWD', 'RWD', 'FWD'] %}
                <option {% if vehicle.drive_type == dt %}selected{% endif %}>{{ dt }}</option>
            {% endfor %}
        </select>
        <input type="text" name="transmission" value="{{ vehicle.transmission or '' }}">
        <input type="text" name="mileage" value="{{ vehicle.mileage or '' }}">
        <textarea name="description">{{ vehicle.description or '' }}</textarea>
        <input type="text" name="primary_image_url" value="{{ vehicle.primary_image or '' }}">
        <input type="text" name="image_urls" value="{{ vehicle.image_paths or '' }}">
        <input type="file" name="images" multiple>
        <label><input type="checkbox" name="featured" {% if vehicle.featured %}checked{% endif %}> Featured</label>
        <label><input type="checkbox" name="customs_verified" {% if vehicle.customs_verified %}checked{% endif %}> Customs Verified</label>
        <input type="number" name="inspection_score" value="{{ vehicle.inspection_score or '' }}" placeholder="Inspection Score">
        <input type="text" name="inspection_report_url" value="{{ vehicle.inspection_report_url or '' }}" placeholder="Inspection Report URL">
        <button type="submit">Update Vehicle</button>
    </form>
</div>
{% endblock %}
