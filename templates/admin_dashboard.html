{% extends "base.html" %}
{% block title %}Admin Dashboard - AUTOSAT{% endblock %}
{% block content %}
<header class="admin-header">
    <div class="container">
        <h1>AUTOSAT <span>Admin</span></h1>
        <a href="/admin/logout">Logout</a>
    </div>
</header>
<div class="admin-dashboard container">
    <div class="stats-grid">
        <div class="stat"><span id="statTotal">0</span>Total</div>
        <div class="stat"><span id="statSale">0</span>Sale</div>
        <div class="stat"><span id="statRent">0</span>Rent</div>
        <div class="stat"><span id="statFeatured">0</span>Featured</div>
        <div class="stat"><span id="statLeads">0</span>Leads</div>
    </div>
    <div class="admin-actions">
        <a href="/admin/new" class="btn">+ Add Vehicle</a>
    </div>
    <table class="admin-table">
        <thead>
            <tr><th>Title</th><th>Brand</th><th>Price</th><th>Type</th><th>Actions</th></tr>
        </thead>
        <tbody id="adminVehicleTable"></tbody>
    </table>
</div>
{% endblock %}
